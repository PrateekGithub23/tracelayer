# TraceLayer backend package definition.
# Every dependency here is open-source and free; nothing requires an API key or billing account.
[project]
name = "tracelayer"
version = "0.1.0"
description = "Evidence-driven security investigation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "python-multipart>=0.0.17",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
tracelayer = "app.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
# S101: asserts are fine in tests; S311: `random` is used only for synthetic data, never for security.
# E501: `ruff format` owns line wrapping; a few compact `fmt: skip` tables are intentionally wider.
ignore = ["S101", "S311", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
# The evaluation case table is intentionally one case per line, so it reads as a table.
"app/evaluation/suite.py" = ["E501"]
"tests/*" = ["E501", "S105", "S106"]
