# CI: free for public repositories on GitHub Actions.
# Backend tests run on SQLite; the PostgreSQL job runs the benchmark pipeline against a real Postgres service.
name: ci
on: [push, pull_request]
permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check app tests && ruff format --check app tests
      - run: mypy app
      - run: pytest
      - run: python -m app.evaluation.suite

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: tl, POSTGRES_PASSWORD: tl, POSTGRES_DB: tl }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U tl" --health-interval 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: python -m app.benchmarks.runner --events 5000 --database-url postgresql+psycopg://tl:tl@localhost:5432/tl

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
