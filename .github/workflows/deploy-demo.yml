# Publishes the static, browser-only demo (frontend/dist-demo) to GitHub Pages.
# Manual only: nothing is deployed until someone with write access runs this workflow.
# The demo contains no backend, no credentials, and only recorded, scrubbed data (see docs/DEPLOYMENT.md).
name: deploy-demo
on: workflow_dispatch
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: build for the Pages sub-path (https://<user>.github.io/<repo>/)
        run: cd frontend && VITE_BASE="${{ steps.pages.outputs.base_path }}/" VITE_REPO_URL="${{ github.server_url }}/${{ github.repository }}" npm run build:demo
      - name: refuse to publish anything secret-looking
        run: |
          ! grep -rEl "argon2id|password_hash|token_hash|BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{30}" frontend/dist-demo
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: frontend/dist-demo }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
