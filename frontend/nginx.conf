# Serves the SPA and proxies the API (single origin). Runs as an unprivileged user on 8080.
# TLS is terminated by a reverse proxy in front of this container in any internet-facing deployment;
# that proxy must add Strict-Transport-Security (the API also sends it when cookies are Secure).

# Defence in depth for credential endpoints (the API also rate-limits per IP and per account).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 30m;   # slightly above the API's 25 MB upload limit
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  location /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    include /etc/nginx/conf.d/proxy_headers.inc;
  }
  location /api/ {
    proxy_pass http://api:8000;
    include /etc/nginx/conf.d/proxy_headers.inc;
    proxy_read_timeout 300s;   # local LLM generation can take a while
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
